# Default configuration for Automated Trading System
# All values can be overridden by user config files in the config/ directory

# Trading mode
trading:
  mode: paper            # 'paper' (default) or 'live' (requires --live flag)
  initial_capital: 100000.0  # CNY

# Risk management
risk:
  max_position_pct: 0.02      # Max 2% of capital per trade
  max_drawdown_pct: 0.20      # 20% max drawdown triggers circuit breaker
  daily_loss_pct: 0.05        # 5% daily loss triggers circuit breaker
  cooldown_days: 3             # Circuit breaker cooldown period
  stop_loss_pct: 0.05          # Default stop loss 5%
  take_profit_pct: 0.15        # Default take profit 15%

# Data source
data:
  source: akshare
  cache_dir: data/cache
  cache_ttl_hours: 24
  request_timeout: 30         # seconds
  max_retries: 1
  retry_delay: 2              # seconds

# Stock screening
screening:
  max_stocks: 5000
  exclude_st: true
  exclude_new_listings_days: 60
  factor_weights:
    technical: 0.40
    fundamental: 0.30
    capital: 0.20
    sentiment: 0.10

# Strategy
strategy:
  default_params:
    trend_following:
      ma_short: 20
      ma_long: 60
      volume_ratio: 1.5
    mean_reversion:
      bollinger_period: 20
      bollinger_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
    breakout:
      lookback_days: 20
      volume_threshold: 2.0

# Backtest
backtest:
  default_start: "2020-01-01"
  max_stocks: 100
  max_days: 2520           # ~10 years
  commission_rate: 0.0003  # 0.03%
  slippage: 0.001          # 0.1%
  benchmark: "000300"      # CSI 300

# Monte Carlo
monte_carlo:
  simulations: 1000
  confidence_levels: [0.10, 0.25, 0.50, 0.75, 0.90]

# Deflated Sharpe Ratio
deflated_sharpe:
  num_trials: 100
  variance_multiplier: 3.0

# Output
output:
  format: json             # 'json' or 'markdown'
  report_dir: output

# Portfolio optimization
portfolio:
  covariance:
    method: sample           # 'sample', 'ledoit_wolf', or 'ewma'
    ewma_lambda: 0.94        # Decay factor for EWMA covariance
  optimizer:
    risk_free_rate: 0.02     # Annual risk-free rate (2%)
    max_weight: 0.25         # Maximum weight per asset
    min_weight: 0.0          # Minimum weight per asset
  risk_parity:
    method: equal_risk       # 'equal_risk' or 'inverse_volatility'

# ML / Statistical Arbitrage
ml:
  arbitrage:
    entry_zscore: 2.0        # Z-score threshold for entry
    exit_zscore: 0.5         # Z-score threshold for exit
    half_life_window: 252    # Max half-life window (trading days)
    lookback_period: 252     # Default lookback for rolling calculations
    pca_threshold: 2.0       # Z-score threshold for PCA mispricing
    hmm_n_regimes: 3         # Number of HMM regimes (bull/bear/sideways)
    kalman_delta: 1e-4       # Initial state covariance for Kalman filter
    kalman_transition_cov: 1e-5  # Transition noise covariance for Kalman

# Daily recommendation (advice only — no trading in this milestone)
recommend:
  top_n: 10
  watchlist_n: 10
  universe: custom              # mainboard | custom  (custom = liquid mainboard sample for reliable runs)
  custom_symbols:
    - "600519"
    - "600036"
    - "601318"
    - "600900"
    - "601166"
    - "600030"
    - "601398"
    - "600276"
    - "000001"
    - "000002"
    - "000858"
    - "002415"
    - "002594"
    - "601012"
    - "600887"
    - "601888"
    - "000568"
    - "002304"
    - "600309"
    - "601919"
  # Cap scoring cost (akshare rate limits). 0 = no cap (full mainboard).
  max_score_stocks: 400
  # How many top-scored names get news + agent/LLM analysis
  llm_candidate_n: 30
  # Dual indicators (0-100 each)
  dual_scores:
    tech_weight: 0.60
    news_weight: 0.40
  # Final judge: cursor-agent (default) | api (.env LLM) | rules
  judge_mode: cursor-agent
  min_total_score: 55
  min_listing_days: 60
  exclude_st: true
  reason_language: "zh-CN"
  max_reasons: 5
  max_risks: 3
  news_per_symbol: 8
  lookback_days: 120
  report_formats: ["markdown", "json"]
  schedule_hint: "15:35"
  # Confidence is 0-100 in reports
  confidence_min_display: 0

# LLM settings (API key / base / model come from .env — see .env.example)
llm:
  enabled: true
  # These are fallbacks only; .env overrides take precedence at runtime
  api_base_env: LLM_API_BASE
  api_key_env: LLM_API_KEY
  model_env: LLM_MODEL
  timeout_seconds: 90
  max_tokens: 2048
  temperature: 0.3
  # Persist prompt/response under output/snapshots for audit
  save_traces: true

# CLI
cli:
  theme: dark
  table_style: rounded